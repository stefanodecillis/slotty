services:
  app:
    image: ${SLOTTY_TEST_IMAGE:?}
    environment:
      SLOTTY_PUBLIC_URL: ${SLOTTY_TEST_PUBLIC_ORIGIN:?}
      SLOTTY_ADMIN_ORIGIN: ${SLOTTY_TEST_ADMIN_ORIGIN:?}
      SLOTTY_DATABASE_URL: file:/app/data/slotty.db
      SLOTTY_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SLOTTY_SESSION_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==
      SLOTTY_GOOGLE_CLIENT_ID: synthetic-client
      SLOTTY_GOOGLE_CLIENT_SECRET: synthetic-secret
      SLOTTY_LOG_LEVEL: warn
    volumes:
      - ${SLOTTY_TEST_DATA_DIR:?}:/app/data
    networks: [isolated]
  proxy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:${SLOTTY_TEST_ADMIN_PORT:?}:443"
      - "127.0.0.1:${SLOTTY_TEST_PUBLIC_PORT:?}:80"
    volumes:
      - ${SLOTTY_TEST_CADDYFILE:?}:/etc/caddy/Caddyfile:ro
    networks: [isolated, frontend]
networks:
  isolated:
    internal: true
  frontend: {}
